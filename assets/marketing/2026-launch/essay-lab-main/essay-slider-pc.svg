<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="레전드스터디 LAB 논술 LAB — 내 논술 답안, 무엇이 부족할까?">
  <!-- PACKAGE B · MAIN SLIDER 2 · ESSAY LAB · PC 1200x480 · status READY_AFTER_FEATURE (DD-3/DD-4) -->
  <defs>
    <style>
      .ko{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;}
      .eyebrow{font-size:20px;font-weight:600;fill:#8a8a8a;letter-spacing:.5px;}
      .h1{font-size:46px;font-weight:800;fill:#1a1a1a;}
      .sub{font-size:21px;font-weight:400;fill:#4a4a4a;}
      .chip{font-size:17px;font-weight:700;fill:#1f1300;}
      .step{font-size:18px;font-weight:600;fill:#4a4a4a;}
      .cta{font-size:22px;font-weight:800;fill:#1f1300;}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="8" height="480" fill="#ffac14"/>

  <!-- TEXT (left) -->
  <text class="ko eyebrow" x="72" y="112">레전드스터디 LAB · 논술 LAB</text>
  <text class="ko h1" x="72" y="184">내 논술 답안, 무엇이 부족할까?</text>
  <text class="ko sub" x="72" y="236">대학별 평가·채점 기준에 맞춰 내 답안을 점검하고</text>
  <text class="ko sub" x="72" y="266">직접 다시 써보세요.</text>

  <!-- Benefit chip (hide if DD-3 not cleared) -->
  <g>
    <rect x="72" y="300" width="300" height="44" rx="22" fill="#fff3dc" stroke="#ffd98a"/>
    <text class="ko chip" x="222" y="329" text-anchor="middle">신규 가입 시 첨삭권 3회 제공</text>
  </g>

  <!-- CTA -->
  <rect x="72" y="372" width="286" height="62" rx="12" fill="#ffac14"/>
  <text class="ko cta" x="215" y="411" text-anchor="middle">논술 LAB 시작하기</text>

  <!-- RIGHT: calm 3-step visual, no university imagery/crest -->
  <g transform="translate(760,120)">
    <rect x="0" y="0" width="360" height="80" rx="12" fill="#f7f8fa" stroke="#e6e8ec"/>
    <text class="ko step" x="24" y="48">1 · 답안 작성</text>
    <rect x="0" y="100" width="360" height="80" rx="12" fill="#f7f8fa" stroke="#e6e8ec"/>
    <text class="ko step" x="24" y="148">2 · 첨삭 (대학별 기준)</text>
    <rect x="0" y="200" width="360" height="80" rx="12" fill="#fff3dc" stroke="#ffd98a"/>
    <text class="ko step" x="24" y="248" fill="#1f1300">3 · 재작성 → 변화 확인</text>
  </g>
</svg>

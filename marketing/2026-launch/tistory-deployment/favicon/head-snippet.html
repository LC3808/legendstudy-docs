<!-- ============================================================
  LEGENDSTUDY FAVICON — optional modern-icon <head> snippet
  ============================================================
  The current skin already has ONE favicon line (keep it working):
      <link rel="shortcut icon" href="[##_blog_link_##]favicon.ico">
  Minimal path: just replace the uploaded favicon.ico (see favicon/README.md) —
  no HTML change needed.

  Enhancement (optional): to add crisp PNG sizes + an Apple touch icon, paste the
  block below into skin.html <head>, right AFTER the existing shortcut-icon line.
  Upload the PNG assets as skin images and replace {SKIN_IMG} with your skin image
  base URL (Tistory: the uploaded file URL, e.g. https://tistoryX.daumcdn.net/.../skin/images/).
  ============================================================ -->
<!-- LEGENDSTUDY FAVICON START -->
<link rel="icon" type="image/png" sizes="32x32" href="{SKIN_IMG}favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{SKIN_IMG}favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{SKIN_IMG}apple-touch-icon.png">
<!-- LEGENDSTUDY FAVICON END -->
